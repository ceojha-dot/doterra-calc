<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded Pastel Purple Background (도테라 퍼플 테마) -->
  <rect width="512" height="512" rx="104" fill="#b388b8"/>
  
  <!-- Outer Calculator Frame (White border) -->
  <rect x="146" y="80" width="220" height="352" rx="44" fill="none" stroke="#ffffff" stroke-width="24" stroke-linejoin="round"/>
  
  <!-- Calculator Screen (Top Display with Drop) -->
  <rect x="178" y="122" width="156" height="88" rx="16" fill="#ffffff"/>
  
  <!-- Water / Oil Drop in Display -->
  <!-- Drop Path centered at (256, 166) -->
  <path d="M 256 138 C 256 138 238 162 238 174 C 238 184 246 192 256 192 C 266 192 274 184 274 174 C 274 162 256 138 256 138 Z" fill="#b388b8"/>
  
  <!-- Keypad Buttons (3x3 Grid of Rounded Square Keys) -->
  <!-- Row 1: y=238, rx=8, width=38, height=38 -->
  <rect x="178" y="238" width="38" height="38" rx="8" fill="#ffffff"/>
  <rect x="237" y="238" width="38" height="38" rx="8" fill="#ffffff"/>
  <rect x="296" y="238" width="38" height="38" rx="8" fill="#ffffff"/>

  <!-- Row 2: y=292 -->
  <rect x="178" y="292" width="38" height="38" rx="8" fill="#ffffff"/>
  <rect x="237" y="292" width="38" height="38" rx="8" fill="#ffffff"/>
  <rect x="296" y="292" width="38" height="38" rx="8" fill="#ffffff"/>

  <!-- Row 3: y=346 -->
  <rect x="178" y="346" width="38" height="38" rx="8" fill="#ffffff"/>
  <rect x="237" y="346" width="38" height="38" rx="8" fill="#ffffff"/>
  <rect x="296" y="346" width="38" height="38" rx="8" fill="#ffffff"/>
</svg>
